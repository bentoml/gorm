version: "2"
linters:
  enable:
    - cyclop
    - gocritic
    - gosec
    - misspell
    - prealloc
    - unconvert
    - unparam
    - whitespace
  settings:
    whitespace:
      multi-func: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - gorm.io/gorm
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
